services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cineforge
      POSTGRES_USER: cineforge
      POSTGRES_PASSWORD: cineforge
    ports: ["5432:5432"]
    volumes: ["cineforge-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: ["cineforge-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cineforge
      MINIO_ROOT_PASSWORD: change-me-in-production
    ports: ["9000:9000", "9001:9001"]
    volumes: ["cineforge-minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 cineforge change-me-in-production &&
      mc mb --ignore-existing local/cineforge &&
      mc anonymous set none local/cineforge"

volumes:
  cineforge-postgres:
  cineforge-redis:
  cineforge-minio:
